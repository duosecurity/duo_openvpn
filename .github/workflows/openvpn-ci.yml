name: OpenVPN CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: OpenVPN - C shim build & hardening check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build duo_openvpn.so
        run: make
      - name: Verify stack protector
        run: nm duo_openvpn.so | grep -q __stack_chk_fail
      - name: Verify RELRO
        run: readelf -l duo_openvpn.so | grep -q GNU_RELRO
      - name: Verify BIND_NOW
        run: readelf -d duo_openvpn.so | grep -q BIND_NOW

  test:
    name: OpenVPN - test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: pip install -r requirements-dev.txt
      - name: Run test script
        run: python test_duo_openvpn.py

